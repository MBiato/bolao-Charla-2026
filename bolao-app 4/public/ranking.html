<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Charla Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--orange:#F45B00;--blue:#1B3AE8;--red:#E8001C;--black:#0A0A0A;--white:#FFFFFF;--off-white:#FFF5EE;--orange-dark:#C84A00}
body{font-family:'Inter',sans-serif;background:var(--orange);color:var(--black);min-height:100vh}
.header{background:var(--white);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--orange)}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--orange);letter-spacing:.04em;line-height:1}
.logo-text span{color:var(--blue)}
.sb-logo{height:22px;object-fit:contain}
.header a{color:var(--orange);font-size:.78rem;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.wrap{padding:1rem;max-width:480px;margin:0 auto}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--white);letter-spacing:.04em;text-shadow:2px 2px 0 var(--orange-dark);margin-bottom:.2rem}
.page-sub{font-size:.68rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--white);display:inline-block;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rank-card{background:var(--white);border-radius:6px;padding:.85rem 1rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.75rem;border-left:4px solid #eee}
.rank-card.top1{border-left-color:#FFD600}
.rank-card.top2{border-left-color:#C0C0C0}
.rank-card.top3{border-left-color:#CD7F32}
.pos{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#ddd;width:26px;text-align:center;flex-shrink:0;line-height:1}
.rank-card.top1 .pos{color:#C8A000}
.rank-card.top2 .pos{color:#909090}
.rank-card.top3 .pos{color:#A06020}
.av{width:38px;height:38px;border-radius:3px;background:var(--off-white);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--orange);flex-shrink:0}
.rank-card.top1 .av{background:#FFF8CC;color:#C8A000}
.rank-card.top2 .av{background:#F5F5F5;color:#909090}
.rank-card.top3 .av{background:#FFF0E8;color:#A06020}
.info{flex:1;min-width:0}
.name{font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--black)}
.detail{font-size:.68rem;color:#aaa;margin-top:2px}
.mini-prog{height:3px;background:#f0f0f0;border-radius:2px;margin-top:.4rem;overflow:hidden}
.mini-fill{height:3px;background:var(--orange);border-radius:2px}
.pts-block{text-align:right;flex-shrink:0}
.pts-num{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--orange);line-height:1}
.pts-lbl{font-size:.62rem;color:#aaa;text-transform:uppercase;letter-spacing:.06em}
.btn{width:100%;padding:.85rem;border-radius:4px;border:none;cursor:pointer;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:.5rem;font-family:'Inter',sans-serif}
.btn-blue{background:var(--blue);color:var(--white)}
.btn-white{background:var(--white);color:var(--orange)}
.empty{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,.5);font-size:.9rem}
.sponsor-bar{background:var(--orange-dark);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between}
.sponsor-bar span{font-size:.62rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="logo-text">CHARLA <span>COPA</span></div>
    <div style="font-size:.58rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em">Ranking ao vivo</div>
  </div>
  <div style="display:flex;align-items:center;gap:.75rem">
    <a href="/">Palpitar</a>
    <img src="sportingbet-blue.png" class="sb-logo" alt="Sportingbet">
  </div>
</div>
<div class="wrap">
  <div class="page-title">Ranking</div>
  <div class="page-sub"><div class="live-dot"></div>Atualiza a cada 30 segundos</div>
  <div id="content"><div class="empty">Carregando...</div></div>
  <button class="btn btn-blue" onclick="load()">Atualizar agora</button>
  <button class="btn btn-white" onclick="location.href='/'">Dar palpites</button>
</div>
<div class="sponsor-bar">
  <span>Patrocinador oficial</span>
  <img src="sportingbet-white.png" style="height:16px;object-fit:contain" alt="Sportingbet">
</div>
<script>
async function load(){
  const [ranking,jogos]=await Promise.all([fetch('/api/ranking').then(r=>r.json()),fetch('/api/jogos').then(r=>r.json())]);
  const total=jogos.length;
  const el=document.getElementById('content');
  if(!ranking.length){el.innerHTML='<div class="empty">Nenhum palpite ainda.</div>';return;}
  const topClass=i=>i===0?'top1':i===1?'top2':i===2?'top3':'';
  const medal=['🥇','🥈','🥉'];
  el.innerHTML=ranking.map((r,i)=>{
    const pct=Math.round(r.total/total*100);
    return `<div class="rank-card ${topClass(i)}">
      <div class="pos">${i+1}</div>
      <div class="av">${r.nome.slice(0,2).toUpperCase()}</div>
      <div class="info">
        <div class="name">${r.nome} ${i<3?medal[i]:''}</div>
        <div class="detail">${r.exatos} placar exato · ${r.vencedores} vencedor · ${r.total}/${total}</div>
        <div class="mini-prog"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="pts-block">
        <div class="pts-num">${r.pts}</div>
        <div class="pts-lbl">pts</div>
      </div>
    </div>`;
  }).join('');
}
load();setInterval(load,30000);
</script>
</body>
</html>
