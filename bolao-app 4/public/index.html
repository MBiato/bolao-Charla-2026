<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charla Copa 2026 — Bolão</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#F45B00;
  --blue:#1B3AE8;
  --red:#E8001C;
  --black:#0A0A0A;
  --white:#FFFFFF;
  --off-white:#FFF5EE;
  --orange-dark:#C84A00;
  --orange-light:#FF7A2E;
  --card-bg:#FFFFFF;
  --text-muted:#C0602A;
}
body{font-family:'Inter',sans-serif;background:var(--orange);color:var(--black);min-height:100vh}

/* HEADER */
.header{background:var(--white);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10}
.header-left{display:flex;flex-direction:column;gap:1px}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--orange);letter-spacing:.04em;line-height:1}
.logo-text span{color:var(--blue)}
.powered{font-size:.6rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em}
.sb-logo{height:22px;object-fit:contain}
.header-right-info{display:flex;align-items:center;gap:.6rem}

/* AVATAR */
.avatar{width:34px;height:34px;border-radius:3px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--white);flex-shrink:0}

/* SCREENS */
.screen{display:none;padding:1rem;max-width:480px;margin:0 auto}
.screen.on{display:block}

/* HERO */
.hero{text-align:center;padding:1.25rem 0 1rem}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:3.8rem;line-height:.92;color:var(--white);letter-spacing:.02em;text-shadow:3px 3px 0 var(--orange-dark)}
.hero-title span{color:var(--blue);text-shadow:3px 3px 0 #0a1f8a;display:block}
.hero-sub{font-size:.75rem;color:rgba(255,255,255,.75);margin-top:.5rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.hero-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--white);color:var(--orange);font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em;margin-top:.6rem}

/* SECTION LABEL */
.section-label{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}

/* PLAYER GRID */
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.player-btn{background:var(--white);border:2px solid rgba(255,255,255,.3);border-radius:6px;padding:.85rem .5rem;cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.player-btn:active{transform:scale(.96)}
.player-btn.sel{border-color:var(--blue);background:var(--blue)}
.player-btn .av{width:38px;height:38px;border-radius:3px;background:var(--off-white);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--orange);margin:0 auto .4rem;transition:all .15s}
.player-btn.sel .av{background:rgba(255,255,255,.2);color:var(--white)}
.player-btn .pname{font-size:.78rem;font-weight:700;color:var(--orange-dark);text-transform:uppercase;letter-spacing:.04em;transition:all .15s}
.player-btn.sel .pname{color:var(--white)}
.player-btn small{font-size:.65rem;color:var(--text-muted);display:block;margin-top:2px;font-weight:600;transition:all .15s}
.player-btn.sel small{color:rgba(255,255,255,.7)}

/* BUTTONS */
.btn{width:100%;padding:.9rem;border-radius:4px;border:none;cursor:pointer;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .15s;font-family:'Inter',sans-serif}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:var(--white)}
.btn-primary:disabled{background:rgba(0,0,0,.15);color:rgba(255,255,255,.4);cursor:not-allowed;transform:none}
.btn-white{background:var(--white);color:var(--orange);margin-top:.5rem}
.btn-outline{background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.5);margin-top:.5rem}

/* ROUND TABS */
.round-tabs{display:flex;gap:.4rem;margin-bottom:.85rem}
.rtab{flex:1;padding:.55rem;border-radius:4px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);font-size:.75rem;font-weight:700;color:rgba(255,255,255,.6);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;transition:all .15s}
.rtab.on{background:var(--white);color:var(--orange);border-color:var(--white)}

/* GAME CARDS */
.game-card{background:var(--white);border:2px solid rgba(255,255,255,.5);border-radius:6px;padding:.85rem;margin-bottom:.5rem;position:relative;overflow:hidden;transition:border-color .2s}
.game-card.filled{border-color:var(--blue)}
.game-card.filled::after{content:'✓';position:absolute;top:6px;right:8px;font-size:.65rem;color:var(--blue);font-weight:700}
.game-meta{font-size:.68rem;color:#aaa;margin-bottom:.6rem;text-align:center;text-transform:uppercase;letter-spacing:.06em}
.game-row{display:grid;grid-template-columns:1fr 52px 18px 52px 1fr;align-items:center;gap:.4rem}
.tname{font-size:.75rem;font-weight:700;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.03em}
.tname.home{text-align:right}
.sin{width:100%;height:44px;border:2px solid #eee;border-radius:4px;text-align:center;font-size:1.3rem;font-weight:900;background:#fafafa;color:var(--black);-moz-appearance:textfield;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;transition:all .15s}
.sin::-webkit-outer-spin-button,.sin::-webkit-inner-spin-button{-webkit-appearance:none}
.sin:focus{outline:none;border-color:var(--orange);background:#FFF5EE}
.sin.ok{border-color:var(--blue);background:#EEF2FF;color:var(--blue)}
.vs{text-align:center;font-size:.7rem;color:#ccc;font-weight:700}

/* PROGRESS */
.progress-wrap{background:rgba(0,0,0,.15);border-radius:2px;height:5px;margin-bottom:.3rem}
.progress-fill{background:var(--white);border-radius:2px;height:5px;transition:width .4s}
.progress-label{font-size:.68rem;color:rgba(255,255,255,.7);margin-bottom:.85rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* DONE */
.done-box{background:var(--white);border-radius:8px;padding:2rem 1.25rem;text-align:center;margin-bottom:1rem;border-top:4px solid var(--blue)}
.done-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--orange);margin:.75rem 0 .4rem;letter-spacing:.04em}
.done-sub{font-size:.82rem;color:#888;line-height:1.5}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--blue);color:var(--white);padding:.55rem 1.25rem;border-radius:3px;font-size:.78rem;font-weight:700;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.toast.show{opacity:1}

/* SPONSOR STRIP */
.sponsor-strip{background:var(--orange-dark);padding:.5rem 1rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.sponsor-strip span{font-size:.65rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>

<div class="header" id="header" style="display:none">
  <div class="header-left">
    <div class="logo-text">CHARLA <span>COPA</span></div>
    <div class="powered">Powered by</div>
  </div>
  <div class="header-right-info">
    <div style="text-align:right;font-size:.68rem;color:#aaa;text-transform:uppercase;letter-spacing:.04em" id="hdr-sub"></div>
    <div class="avatar" id="hdr-av"></div>
  </div>
</div>

<!-- TELA 1: ESCOLHA -->
<div class="screen on" id="s-pick">
  <div style="background:var(--white);padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--orange)">
    <div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--orange);letter-spacing:.04em;line-height:1">CHARLA <span style="color:var(--blue)">COPA</span></div>
      <div style="font-size:.58rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em">Bolão Copa 2026</div>
    </div>
    <img src="sportingbet-blue.png" class="sb-logo" alt="Sportingbet">
  </div>
  <div style="padding:1rem;max-width:480px;margin:0 auto">
    <div class="hero">
      <div class="hero-title">CHARLA<span>COPA</span></div>
      <div class="hero-sub">Bolão Copa do Mundo 2026</div>
      <div class="hero-badge">⚽ Quem vai ser o campeão?</div>
    </div>
    <div class="section-label">Selecione seu nome</div>
    <div class="player-grid" id="player-grid"></div>
    <button class="btn btn-primary" id="btn-start" disabled onclick="goToGames()">Entrar e palpitar</button>
    <button class="btn btn-white" onclick="location.href='ranking.html'">Ver ranking ao vivo</button>
    <div style="margin-top:1.25rem;padding:.65rem 1rem;background:rgba(0,0,0,.1);border-radius:4px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:.68rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em;font-weight:600">Patrocinador oficial</span>
      <img src="sportingbet-white.png" style="height:18px;object-fit:contain" alt="Sportingbet">
    </div>
  </div>
</div>

<!-- TELA 2: PALPITES -->
<div class="screen" id="s-games">
  <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
  <div class="progress-label" id="prog-label"></div>
  <div class="round-tabs">
    <button class="rtab on" onclick="setRound(1,this)">Rodada 1</button>
    <button class="rtab" onclick="setRound(2,this)">Rodada 2</button>
    <button class="rtab" onclick="setRound(3,this)">Rodada 3</button>
  </div>
  <div id="games-list"></div>
  <button class="btn btn-outline" onclick="goBack()">Trocar participante</button>
</div>

<!-- TELA 3: DONE -->
<div class="screen" id="s-done">
  <div style="padding:1rem;max-width:480px;margin:0 auto">
    <div class="done-box">
      <div style="font-size:2.5rem">🏆</div>
      <div class="done-title" id="done-name"></div>
      <div class="done-sub" id="done-msg"></div>
    </div>
    <button class="btn btn-primary" onclick="goBack()">Outro participante</button>
    <button class="btn btn-white" onclick="location.href='ranking.html'">Ver ranking</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let jogos=[],nomes=[],currentPlayer=null,currentRound=1,palpites={};
async function init(){
  [jogos,nomes]=await Promise.all([fetch('/api/jogos').then(r=>r.json()),fetch('/api/nomes').then(r=>r.json())]);
  buildGrid();
}
function buildGrid(){
  const g=document.getElementById('player-grid');
  nomes.forEach(n=>{
    const d=document.createElement('div');
    d.className='player-btn';d.id='pb-'+n;d.onclick=()=>selectPlayer(n);
    d.innerHTML=`<div class="av">${n.slice(0,2).toUpperCase()}</div><div class="pname">${n}</div><small id="ps-${n}"></small>`;
    g.appendChild(d);
  });
  updateCounts();
}
async function updateCounts(){
  for(const n of nomes){
    const data=await fetch('/api/palpites/'+encodeURIComponent(n)).then(r=>r.json());
    const c=Object.keys(data).length;
    const el=document.getElementById('ps-'+n);
    if(el)el.textContent=c>0?c+' palpites':'';
  }
}
function selectPlayer(n){
  document.querySelectorAll('.player-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('pb-'+n).classList.add('sel');
  currentPlayer=n;
  const btn=document.getElementById('btn-start');
  btn.disabled=false;btn.textContent='Entrar como '+n.toUpperCase();
}
async function goToGames(){
  if(!currentPlayer)return;
  palpites=await fetch('/api/palpites/'+encodeURIComponent(currentPlayer)).then(r=>r.json());
  document.getElementById('header').style.display='flex';
  document.getElementById('hdr-av').textContent=currentPlayer.slice(0,2).toUpperCase();
  setRound(1,document.querySelector('.rtab'));
  show('s-games');updateProgress();
}
function setRound(r,btn){
  currentRound=r;
  document.querySelectorAll('.rtab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');renderGames();
}
function renderGames(){
  const list=document.getElementById('games-list');
  list.innerHTML=jogos.filter(g=>g[1]===currentRound).map(g=>{
    const id=g[0],p=palpites[id];
    const va=p!==undefined?p[0]:'',vb=p!==undefined?p[1]:'';
    const filled=va!==''&&vb!==''?'filled':'';
    return `<div class="game-card ${filled}" id="gc-${id}">
      <div class="game-meta">${g[2]} · ${g[3]}</div>
      <div class="game-row">
        <div class="tname home">${g[4]}</div>
        <input class="sin ${va!==''?'ok':''}" type="number" min="0" max="20" id="ga-${id}" value="${va}" placeholder="—" oninput="onInput(${id})">
        <div class="vs">×</div>
        <input class="sin ${vb!==''?'ok':''}" type="number" min="0" max="20" id="gb-${id}" value="${vb}" placeholder="—" oninput="onInput(${id})">
        <div class="tname">${g[5]}</div>
      </div>
    </div>`;
  }).join('');
}
async function onInput(id){
  const a=document.getElementById('ga-'+id),b=document.getElementById('gb-'+id);
  a.classList.toggle('ok',a.value!=='');b.classList.toggle('ok',b.value!=='');
  const card=document.getElementById('gc-'+id);
  if(a.value!==''&&b.value!==''){
    const ga=parseInt(a.value),gb=parseInt(b.value);
    palpites[id]=[ga,gb];card.classList.add('filled');
    await fetch('/api/palpites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:currentPlayer,jogo_id:id,gols_a:ga,gols_b:gb})});
    updateProgress();showToast('✓ Salvo');
  } else card.classList.remove('filled');
}
function updateProgress(){
  const total=jogos.length,done=Object.keys(palpites).length,pct=Math.round(done/total*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-label').textContent=done+' de '+total+' jogos palpitados — '+pct+'%';
  document.getElementById('hdr-sub').textContent=done+'/'+total+' palpites';
}
function goBack(){
  currentPlayer=null;document.getElementById('header').style.display='none';
  document.querySelectorAll('.player-btn').forEach(b=>b.classList.remove('sel'));
  const btn=document.getElementById('btn-start');btn.disabled=true;btn.textContent='Entrar e palpitar';
  updateCounts();show('s-pick');
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1200);}
init();
</script>
</body>
</html>
