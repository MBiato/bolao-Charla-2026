<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolao Copa 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
.header{background:#0D4F2E;padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:10}
.header h1{color:#FFD700;font-size:1.1rem;font-weight:600}
.header p{color:#9FE1CB;font-size:.8rem}
.avatar{width:38px;height:38px;border-radius:50%;background:#1A6B3C;display:flex;align-items:center;justify-content:center;color:#FFD700;font-weight:700;font-size:.9rem;flex-shrink:0}

.screen{display:none;padding:1rem;max-width:500px;margin:0 auto}
.screen.on{display:block}

.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0}
.player-btn{background:#fff;border:1.5px solid #e0e0e0;border-radius:12px;padding:.85rem .5rem;cursor:pointer;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.player-btn:active{transform:scale(.97)}
.player-btn.sel{border-color:#0D4F2E;background:#E8F5E9}
.player-btn .av{width:40px;height:40px;border-radius:50%;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#0D4F2E;margin:0 auto .4rem}
.player-btn.sel .av{background:#0D4F2E;color:#FFD700}
.player-btn span{font-size:.8rem;font-weight:600;color:#1a1a1a;display:block}
.player-btn small{font-size:.7rem;color:#888;margin-top:2px;display:block}

.btn{width:100%;padding:.85rem;border-radius:10px;border:none;cursor:pointer;font-size:1rem;font-weight:600;transition:all .15s}
.btn-green{background:#0D4F2E;color:#FFD700}
.btn-green:disabled{background:#ccc;color:#999;cursor:not-allowed}
.btn-green:active:not(:disabled){transform:scale(.98)}
.btn-outline{background:#fff;color:#0D4F2E;border:1.5px solid #0D4F2E;margin-top:.6rem}

.round-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.rtab{flex:1;padding:.55rem;border-radius:8px;border:1.5px solid #e0e0e0;background:#fff;font-size:.8rem;font-weight:600;color:#888;cursor:pointer;transition:all .15s}
.rtab.on{background:#0D4F2E;color:#FFD700;border-color:#0D4F2E}

.game-card{background:#fff;border-radius:12px;padding:.85rem 1rem;margin-bottom:.6rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.game-meta{font-size:.72rem;color:#888;margin-bottom:.6rem;text-align:center}
.game-row{display:grid;grid-template-columns:1fr 52px 16px 52px 1fr;align-items:center;gap:.4rem}
.tname{font-size:.82rem;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.home{text-align:right}
.sin{width:100%;height:44px;border:1.5px solid #ddd;border-radius:8px;text-align:center;font-size:1.2rem;font-weight:700;background:#fafafa;color:#1a1a1a;-moz-appearance:textfield}
.sin::-webkit-outer-spin-button,.sin::-webkit-inner-spin-button{-webkit-appearance:none}
.sin:focus{outline:none;border-color:#0D4F2E;background:#E8F5E9}
.sin.ok{border-color:#0D4F2E;background:#E8F5E9}
.vs{text-align:center;font-size:.75rem;color:#aaa;font-weight:600}

.progress{background:#e0e0e0;border-radius:99px;height:5px;margin-bottom:.3rem}
.progress-fill{background:#0D4F2E;border-radius:99px;height:5px;transition:width .3s}
.progress-label{font-size:.75rem;color:#888;margin-bottom:.85rem}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#0D4F2E;color:#fff;padding:.65rem 1.25rem;border-radius:99px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.done-box{background:#fff;border-radius:16px;padding:2rem 1.25rem;text-align:center;margin-bottom:1rem}
.done-icon{font-size:3rem;margin-bottom:.75rem}
.done-box h2{font-size:1.2rem;font-weight:700;color:#0D4F2E;margin-bottom:.4rem}
.done-box p{font-size:.85rem;color:#666;line-height:1.5}
</style>
</head>
<body>

<div class="header" id="header" style="display:none">
  <div class="avatar" id="hdr-av"></div>
  <div>
    <h1 id="hdr-title">Bolao Copa 2026</h1>
    <p id="hdr-sub"></p>
  </div>
</div>

<!-- TELA 1: ESCOLHA DO NOME -->
<div class="screen on" id="s-pick">
  <div style="text-align:center;padding:1.5rem 0 1rem">
    <div style="font-size:2.5rem;margin-bottom:.5rem">⚽</div>
    <h2 style="font-size:1.3rem;font-weight:700;color:#0D4F2E">Bolao Copa 2026</h2>
    <p style="font-size:.85rem;color:#666;margin-top:.3rem">Quem e voce?</p>
  </div>
  <div class="player-grid" id="player-grid"></div>
  <button class="btn btn-green" id="btn-start" disabled onclick="goToGames()">Entrar</button>
  <button class="btn btn-outline" onclick="location.href='ranking.html'">Ver ranking</button>
</div>

<!-- TELA 2: PALPITES -->
<div class="screen" id="s-games">
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="progress-label" id="prog-label"></div>
  <div class="round-tabs">
    <button class="rtab on" onclick="setRound(1,this)">Rodada 1</button>
    <button class="rtab" onclick="setRound(2,this)">Rodada 2</button>
    <button class="rtab" onclick="setRound(3,this)">Rodada 3</button>
  </div>
  <div id="games-list"></div>
  <button class="btn btn-green" onclick="goBack()">Trocar participante</button>
</div>

<!-- TELA 3: CONFIRMAÇÃO -->
<div class="screen" id="s-done">
  <div class="done-box">
    <div class="done-icon">🏆</div>
    <h2 id="done-name"></h2>
    <p id="done-msg"></p>
  </div>
  <button class="btn btn-green" onclick="goBack()">Outro participante</button>
  <button class="btn btn-outline" onclick="location.href='ranking.html'">Ver ranking</button>
</div>

<div class="toast" id="toast"></div>

<script>
let jogos = [], nomes = [], currentPlayer = null, currentRound = 1, palpites = {};

async function init() {
  [jogos, nomes] = await Promise.all([
    fetch('/api/jogos').then(r=>r.json()),
    fetch('/api/nomes').then(r=>r.json())
  ]);
  buildGrid();
}

function buildGrid() {
  const g = document.getElementById('player-grid');
  nomes.forEach(n => {
    const d = document.createElement('div');
    d.className = 'player-btn';
    d.id = 'pb-' + n;
    d.onclick = () => selectPlayer(n);
    d.innerHTML = `<div class="av">${n.slice(0,2).toUpperCase()}</div><span>${n}</span><small id="ps-${n}"></small>`;
    g.appendChild(d);
  });
  updatePlayerCounts();
}

async function updatePlayerCounts() {
  for (const n of nomes) {
    const data = await fetch('/api/palpites/' + encodeURIComponent(n)).then(r=>r.json());
    const count = Object.keys(data).length;
    const el = document.getElementById('ps-' + n);
    if (el) el.textContent = count > 0 ? count + ' palpites' : '';
  }
}

function selectPlayer(n) {
  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('pb-' + n).classList.add('sel');
  currentPlayer = n;
  const btn = document.getElementById('btn-start');
  btn.disabled = false;
  btn.textContent = 'Entrar como ' + n;
}

async function goToGames() {
  if (!currentPlayer) return;
  palpites = await fetch('/api/palpites/' + encodeURIComponent(currentPlayer)).then(r=>r.json());
  document.getElementById('header').style.display = 'flex';
  document.getElementById('hdr-av').textContent = currentPlayer.slice(0,2).toUpperCase();
  document.getElementById('hdr-title').textContent = currentPlayer;
  setRound(1, document.querySelector('.rtab'));
  show('s-games');
  updateProgress();
}

function setRound(r, btn) {
  currentRound = r;
  document.querySelectorAll('.rtab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  renderGames();
}

function renderGames() {
  const list = document.getElementById('games-list');
  const filtered = jogos.filter(g => g[1] === currentRound);
  list.innerHTML = filtered.map(g => {
    const id = g[0], tA = g[4], tB = g[5];
    const p = palpites[id];
    const va = p !== undefined ? p[0] : '';
    const vb = p !== undefined ? p[1] : '';
    const ca = va !== '' ? 'ok' : '';
    const cb = vb !== '' ? 'ok' : '';
    return `<div class="game-card">
      <div class="game-meta">${g[2]} · ${g[3]}</div>
      <div class="game-row">
        <div class="tname home">${tA}</div>
        <input class="sin ${ca}" type="number" min="0" max="20" id="ga-${id}" value="${va}" placeholder="-" oninput="onInput(${id})">
        <div class="vs">x</div>
        <input class="sin ${cb}" type="number" min="0" max="20" id="gb-${id}" value="${vb}" placeholder="-" oninput="onInput(${id})">
        <div class="tname">${tB}</div>
      </div>
    </div>`;
  }).join('');
}

async function onInput(id) {
  const a = document.getElementById('ga-' + id);
  const b = document.getElementById('gb-' + id);
  a.classList.toggle('ok', a.value !== '');
  b.classList.toggle('ok', b.value !== '');
  if (a.value !== '' && b.value !== '') {
    const ga = parseInt(a.value), gb = parseInt(b.value);
    palpites[id] = [ga, gb];
    await fetch('/api/palpites', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nome: currentPlayer, jogo_id: id, gols_a: ga, gols_b: gb })
    });
    updateProgress();
    showToast('Salvo!');
  }
}

function updateProgress() {
  const total = jogos.length, done = Object.keys(palpites).length;
  const pct = Math.round(done / total * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done + ' de ' + total + ' jogos palpitados (' + pct + '%)';
  document.getElementById('hdr-sub').textContent = done + '/' + total + ' palpites';
}

function goBack() {
  currentPlayer = null;
  document.getElementById('header').style.display = 'none';
  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-start').textContent = 'Entrar';
  updatePlayerCounts();
  show('s-pick');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 1500);
}

init();
</script>
</body>
</html>
