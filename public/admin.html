<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Charla Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1B3AE8;--blue-dark:#0D2BAE;--orange:#F45B00;--white:#FFFFFF;--glass:rgba(255,255,255,.1);--glass-border:rgba(255,255,255,.15);--twoup:#FFD600}
body{font-family:'Inter',sans-serif;background:var(--blue);color:var(--white);min-height:100vh}
.header{background:var(--white);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between}
.charla-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--blue);letter-spacing:.04em;line-height:1}
.charla-logo span{color:var(--orange)}
.sb-logo{height:20px;object-fit:contain}
.header a{color:var(--orange);font-size:.78rem;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.wrap{padding:1rem 1.1rem;max-width:480px;margin:0 auto}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--white);letter-spacing:.04em;margin-bottom:1rem}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:6px;padding:1rem;margin-bottom:.75rem}
.label{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
input,select{width:100%;height:44px;border:1px solid var(--glass-border);border-radius:4px;padding:0 .85rem;font-size:.9rem;background:rgba(255,255,255,.08);color:var(--white);margin-bottom:.6rem;font-family:'Inter',sans-serif}
input::placeholder{color:rgba(255,255,255,.3)}
input:focus,select:focus{outline:none;border-color:var(--orange)}
select option{background:#1B3AE8;color:#fff}
.tabs{display:flex;gap:.4rem;margin-bottom:.85rem}
.tab{flex:1;padding:.55rem;border-radius:4px;border:1px solid var(--glass-border);background:var(--glass);font-size:.72rem;font-weight:700;color:rgba(255,255,255,.45);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif}
.tab.on{background:var(--orange);color:var(--white);border-color:var(--orange)}
.sec{display:none}.sec.on{display:block}
.btn{width:100%;padding:.88rem;border-radius:4px;border:none;cursor:pointer;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.45rem;font-family:'Inter',sans-serif}
.btn-orange{background:var(--orange);color:var(--white)}
.btn-white{background:var(--white);color:var(--blue)}
.btn-glass{background:var(--glass);color:var(--white);border:1px solid var(--glass-border)}
.score-row{display:grid;grid-template-columns:1fr 50px 16px 50px 1fr;align-items:center;gap:.4rem;margin-bottom:.75rem}
.tname{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--white)}
.tname.home{text-align:right}
.sin{width:100%;height:46px;border:1px solid var(--glass-border);border-radius:4px;text-align:center;font-size:1.4rem;font-weight:900;background:rgba(255,255,255,.08);color:var(--white);padding:0;margin:0;-moz-appearance:textfield;font-family:'Bebas Neue',sans-serif}
.sin::-webkit-outer-spin-button,.sin::-webkit-inner-spin-button{-webkit-appearance:none}
.sin:focus{outline:none;border-color:var(--orange)}
.vs{text-align:center;font-size:.75rem;color:rgba(255,255,255,.25);font-weight:700}
.msg{padding:.65rem 1rem;border-radius:4px;font-size:.82rem;margin-bottom:.6rem;display:none;font-weight:600}
.msg.ok{background:rgba(0,230,118,.12);color:#00e676;border:1px solid rgba(0,230,118,.3);display:block}
.msg.err{background:rgba(255,82,82,.12);color:#ff5252;border:1px solid rgba(255,82,82,.3);display:block}
textarea{width:100%;border:1px solid var(--glass-border);border-radius:4px;padding:.75rem;font-size:.75rem;font-family:monospace;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);resize:vertical;margin-bottom:.6rem}
.info-box{background:rgba(255,255,255,.06);border-radius:4px;padding:.75rem 1rem;font-size:.78rem;color:rgba(255,255,255,.55);margin-bottom:.75rem;line-height:1.6;border-left:3px solid var(--orange)}

/* 2UP toggle */
.twoup-section{margin-top:.5rem;display:none}
.twoup-section.show{display:block}
.twoup-toggle{display:flex;align-items:center;gap:.75rem;padding:.75rem;background:rgba(255,214,0,.08);border:1px solid rgba(255,214,0,.2);border-radius:6px;margin-bottom:.6rem;cursor:pointer}
.twoup-toggle input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--twoup);flex-shrink:0;margin:0}
.twoup-label{font-size:.82rem;font-weight:600;color:var(--twoup);flex:1}
.twoup-desc{font-size:.7rem;color:rgba(255,214,0,.6);margin-top:2px}
.twoup-team-select{display:none;margin-top:.5rem}
.twoup-team-select.show{display:block}
.twoup-team-select .label{color:var(--twoup)}
.twoup-badge{display:inline-flex;align-items:center;gap:4px;background:var(--twoup);color:#000;font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em}

.sponsor-bar{background:var(--blue-dark);padding:.55rem 1.1rem;display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.sponsor-bar span{font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div class="charla-logo">CHARLA <span>COPA</span></div>
  <div style="display:flex;align-items:center;gap:.75rem">
    <a href="resultados.html">Resultados</a>
    <a href="/">Voltar</a>
    <img src="sportingbet-blue.png" class="sb-logo" alt="Sportingbet">
  </div>
</div>
<div class="wrap">
  <div class="page-title">Admin</div>
  <div class="card">
    <div class="label">Senha de acesso</div>
    <input type="password" id="senha" placeholder="Senha do administrador" />
  </div>
  <div class="tabs">
    <button class="tab on" onclick="setTab('resultados')">Resultados</button>
    <button class="tab" onclick="setTab('backup')">Backup</button>
  </div>

  <div class="sec on" id="sec-resultados">
    <div class="card">
      <div class="label">Selecione o jogo</div>
      <select id="jogo-sel" onchange="selectGame()"><option value="">-- escolha o jogo --</option></select>

      <div id="score-area" style="display:none">
        <div class="label" style="margin-top:.5rem">Resultado final oficial</div>
        <div class="score-row">
          <div class="tname home" id="ta-label"></div>
          <input class="sin" type="number" min="0" max="20" id="res-a" placeholder="—">
          <div class="vs">×</div>
          <input class="sin" type="number" min="0" max="20" id="res-b" placeholder="—">
          <div class="tname" id="tb-label"></div>
        </div>

        <!-- 2UP SECTION -->
        <div class="twoup-section show" id="twoup-section">
          <label class="twoup-toggle">
            <input type="checkbox" id="twoup-check" onchange="toggleTwoup()">
            <div>
              <div class="twoup-label">⚡ Condição 2UP ativada <span class="twoup-badge">Sportingbet</span></div>
              <div class="twoup-desc">Algum time abriu 2 a 0 neste jogo?</div>
            </div>
          </label>
          <div class="twoup-team-select" id="twoup-team-select">
            <div class="label" style="color:var(--twoup);margin-bottom:.4rem">Qual time abriu 2 a 0?</div>
            <select id="twoup-time" style="border-color:rgba(255,214,0,.3);margin-bottom:0">
              <option value="">-- selecione --</option>
              <option value="A" id="twoup-opt-a"></option>
              <option value="B" id="twoup-opt-b"></option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="msg" id="msg-res"></div>
    <button class="btn btn-orange" onclick="salvarResultado()">Salvar resultado</button>
    <button class="btn btn-white" onclick="location.href='ranking.html'">Ver ranking atualizado</button>
  </div>

  <div class="sec" id="sec-backup">
    <div class="info-box">Com o Supabase os dados ficam salvos permanentemente. O backup é opcional mas útil para exportar os dados.</div>
    <div class="msg" id="msg-bk"></div>
    <button class="btn btn-orange" onclick="baixarBackup()">Baixar backup (JSON)</button>
    <div id="backup-preview" style="display:none">
      <div class="label" style="margin-top:.75rem">Preview</div>
      <textarea id="backup-txt" rows="6" readonly></textarea>
    </div>
  </div>
</div>

<div class="sponsor-bar">
  <span>Patrocinador oficial</span>
  <img src="sportingbet-white.png" style="height:18px;object-fit:contain" alt="Sportingbet">
</div>

<script>
let jogos=[], jogoAtual=null;

function setTab(t){
  document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('on',['resultados','backup'][i]===t));
  document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
  document.getElementById('sec-'+t).classList.add('on');
}

async function init(){
  jogos=await fetch('/api/jogos').then(r=>r.json());
  const sel=document.getElementById('jogo-sel');
  let rd=0;
  jogos.forEach(g=>{
    if(g[1]!==rd){rd=g[1];const og=document.createElement('optgroup');og.label='Rodada '+rd;sel.appendChild(og);}
    const o=document.createElement('option');o.value=g[0];o.textContent='#'+g[0]+' '+g[2]+' '+g[3]+' | '+g[4]+' x '+g[5];sel.appendChild(o);
  });
}

function selectGame(){
  const id=parseInt(document.getElementById('jogo-sel').value);
  const sa=document.getElementById('score-area');
  if(!id){sa.style.display='none';return;}
  jogoAtual=jogos.find(x=>x[0]===id);
  document.getElementById('ta-label').textContent=jogoAtual[4];
  document.getElementById('tb-label').textContent=jogoAtual[5];
  document.getElementById('twoup-opt-a').textContent=jogoAtual[4];
  document.getElementById('twoup-opt-b').textContent=jogoAtual[5];
  document.getElementById('res-a').value='';
  document.getElementById('res-b').value='';
  document.getElementById('twoup-check').checked=false;
  document.getElementById('twoup-team-select').classList.remove('show');
  document.getElementById('twoup-time').value='';
  sa.style.display='block';
}

function toggleTwoup(){
  const checked=document.getElementById('twoup-check').checked;
  document.getElementById('twoup-team-select').classList.toggle('show',checked);
  if(!checked) document.getElementById('twoup-time').value='';
}

function showMsg(id,type,txt){const el=document.getElementById(id);el.className='msg '+type;el.textContent=txt;}

async function salvarResultado(){
  const senha=document.getElementById('senha').value;
  const jogo_id=parseInt(document.getElementById('jogo-sel').value);
  const gols_a=document.getElementById('res-a').value;
  const gols_b=document.getElementById('res-b').value;
  const twoupCheck=document.getElementById('twoup-check').checked;
  const twoup_time=twoupCheck?document.getElementById('twoup-time').value:null;

  if(!senha){showMsg('msg-res','err','Informe a senha.');return;}
  if(!jogo_id){showMsg('msg-res','err','Selecione um jogo.');return;}
  if(gols_a===''||gols_b===''){showMsg('msg-res','err','Informe o placar final.');return;}
  if(twoupCheck&&!twoup_time){showMsg('msg-res','err','Selecione qual time abriu 2 a 0.');return;}

  const res=await fetch('/api/resultado',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({senha,jogo_id,gols_a:parseInt(gols_a),gols_b:parseInt(gols_b),twoup_time})
  });

  if(res.ok){
    let msg='Resultado salvo! Ranking atualizado.';
    if(twoup_time){
      const timeNome=twoup_time==='A'?jogoAtual[4]:jogoAtual[5];
      msg+=` Condição 2UP ativada para ${timeNome}.`;
    }
    showMsg('msg-res','ok',msg);
  } else showMsg('msg-res','err','Senha incorreta.');
}

async function baixarBackup(){
  const senha=document.getElementById('senha').value;
  if(!senha){showMsg('msg-bk','err','Informe a senha primeiro.');return;}
  const res=await fetch('/api/backup?senha='+encodeURIComponent(senha));
  if(!res.ok){showMsg('msg-bk','err','Senha incorreta.');return;}
  const data=await res.json();
  const json=JSON.stringify(data,null,2);
  document.getElementById('backup-txt').value=json;
  document.getElementById('backup-preview').style.display='block';
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='charla-copa-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showMsg('msg-bk','ok','Backup com '+(data.palpites?data.palpites.length:0)+' palpites baixado!');
}

init();
</script>
</body>
</html>
