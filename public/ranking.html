<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking - Bolao Copa 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
.header{background:#0D4F2E;padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem}
.header h1{color:#FFD700;font-size:1.1rem;font-weight:600;flex:1}
.header a{color:#9FE1CB;font-size:.8rem;text-decoration:none}
.wrap{padding:1rem;max-width:500px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:1rem 1.1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pos{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;background:#f0f0f0;color:#666}
.pos.g{background:#FFD700;color:#5a3e00}
.pos.s{background:#C0C0C0;color:#333}
.pos.b{background:#CD7F32;color:#fff}
.av{width:38px;height:38px;border-radius:50%;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#0D4F2E;flex-shrink:0}
.info{flex:1}
.info .name{font-size:.95rem;font-weight:600}
.info .detail{font-size:.75rem;color:#888;margin-top:2px}
.pts{text-align:right}
.pts .big{font-size:1.3rem;font-weight:700;color:#0D4F2E}
.pts .lbl{font-size:.7rem;color:#888}
.section-title{font-size:.75rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .4rem}
.badge{display:inline-block;background:#E8F5E9;color:#0D4F2E;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:.4rem}
.empty{text-align:center;padding:2rem;color:#888;font-size:.9rem}
.btn{width:100%;padding:.85rem;border-radius:10px;border:1.5px solid #0D4F2E;background:#fff;color:#0D4F2E;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:.5rem}
.progress-row{display:flex;align-items:center;gap:.5rem;margin-top:.4rem}
.mini-prog{flex:1;height:4px;background:#e0e0e0;border-radius:99px;overflow:hidden}
.mini-fill{height:4px;background:#0D4F2E;border-radius:99px}
</style>
</head>
<body>
<div class="header">
  <h1>Ranking ao vivo</h1>
  <a href="/">Palpitar</a>
</div>
<div class="wrap">
  <div id="content"><div class="empty">Carregando...</div></div>
  <button class="btn" onclick="load()">Atualizar</button>
</div>
<script>
async function load() {
  const [ranking, jogos] = await Promise.all([
    fetch('/api/ranking').then(r=>r.json()),
    fetch('/api/jogos').then(r=>r.json())
  ]);
  const totalJogos = jogos.length;
  const el = document.getElementById('content');
  if (!ranking.length) { el.innerHTML = '<div class="empty">Nenhum palpite ainda.</div>'; return; }

  const posClass = i => i===0?'g':i===1?'s':i===2?'b':'';
  const medal = ['🥇','🥈','🥉'];

  el.innerHTML = ranking.map((r, i) => {
    const pct = Math.round(r.total / totalJogos * 100);
    return `<div class="card">
      <div class="pos ${posClass(i)}">${i+1}</div>
      <div class="av">${r.nome.slice(0,2).toUpperCase()}</div>
      <div class="info">
        <div class="name">${r.nome} ${i<3?medal[i]:''}</div>
        <div class="detail">${r.exatos} exatos · ${r.vencedores} vencedores · ${r.total}/${totalJogos} palpites</div>
        <div class="progress-row">
          <div class="mini-prog"><div class="mini-fill" style="width:${pct}%"></div></div>
          <span style="font-size:.7rem;color:#888">${pct}%</span>
        </div>
      </div>
      <div class="pts">
        <div class="big">${r.pts}</div>
        <div class="lbl">pontos</div>
      </div>
    </div>`;
  }).join('');
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
