<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Charla Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1B3AE8;--blue-dark:#0D2BAE;--orange:#F45B00;--white:#FFFFFF;--glass:rgba(255,255,255,.1);--glass-border:rgba(255,255,255,.15)}
body{font-family:'Inter',sans-serif;background:var(--blue);color:var(--white);min-height:100vh}
.header{background:var(--white);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between}
.charla-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--blue);letter-spacing:.04em;line-height:1}
.charla-logo span{color:var(--orange)}
.sb-logo{height:20px;object-fit:contain}
.header a{color:var(--orange);font-size:.78rem;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.wrap{padding:1rem 1.1rem;max-width:480px;margin:0 auto}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--white);letter-spacing:.04em;line-height:1;margin-bottom:.2rem}
.page-sub{font-size:.68rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rcard{background:var(--glass);border:1px solid var(--glass-border);border-radius:6px;padding:.85rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.7rem;border-left:3px solid transparent}
.rcard.r1{border-left-color:#FFD600;background:rgba(255,214,0,.08)}
.rcard.r2{border-left-color:#C0C0C0;background:rgba(192,192,192,.06)}
.rcard.r3{border-left-color:#CD7F32;background:rgba(205,127,50,.07)}
.pos{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:rgba(255,255,255,.15);width:24px;text-align:center;flex-shrink:0;line-height:1}
.rcard.r1 .pos{color:#FFD600}
.rcard.r2 .pos{color:#C0C0C0}
.rcard.r3 .pos{color:#CD7F32}
.av{width:36px;height:36px;border-radius:3px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:rgba(255,255,255,.6);flex-shrink:0}
.rcard.r1 .av{background:#FFD600;color:#5a3e00}
.rcard.r2 .av{background:#C0C0C0;color:#333}
.rcard.r3 .av{background:#CD7F32;color:#fff}
.info{flex:1;min-width:0}
.name{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--white)}
.detail{font-size:.67rem;color:rgba(255,255,255,.4);margin-top:2px}
.mprog{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:.35rem;overflow:hidden}
.mfill{height:3px;background:var(--orange);border-radius:2px}
.pts-block{text-align:right;flex-shrink:0}
.pts-num{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--orange);line-height:1}
.pts-lbl{font-size:.62rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em}
.btn{width:100%;padding:.85rem;border-radius:4px;border:none;cursor:pointer;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:.45rem;font-family:'Inter',sans-serif}
.btn-white{background:var(--white);color:var(--blue)}
.btn-glass{background:var(--glass);color:var(--white);border:1px solid var(--glass-border)}
.empty{text-align:center;padding:3rem 1rem;color:rgba(255,255,255,.4)}
.sponsor-bar{background:var(--blue-dark);padding:.55rem 1.1rem;display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.sponsor-bar span{font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div class="charla-logo">CHARLA <span>COPA</span></div>
  <div style="display:flex;align-items:center;gap:.75rem">
    <a href="/">Palpitar</a>
    <img src="sportingbet-blue.png" class="sb-logo" alt="Sportingbet">
  </div>
</div>
<div class="wrap">
  <div class="page-title">Ranking</div>
  <div class="page-sub"><div class="live-dot"></div>Ao vivo · atualiza a cada 30s</div>
  <div id="content"><div class="empty">Carregando...</div></div>
  <button class="btn btn-white" onclick="load()">Atualizar agora</button>
  <button class="btn btn-glass" onclick="location.href='/'">Dar palpites</button>
</div>
<div class="sponsor-bar">
  <span>Patrocinador oficial</span>
  <img src="sportingbet-white.png" style="height:18px;object-fit:contain" alt="Sportingbet">
</div>
<script>
async function load(){
  const [ranking,jogos]=await Promise.all([fetch('/api/ranking').then(r=>r.json()),fetch('/api/jogos').then(r=>r.json())]);
  const total=jogos.length;
  const el=document.getElementById('content');
  if(!ranking.length){el.innerHTML='<div class="empty">Nenhum palpite ainda.</div>';return;}
  const tc=i=>i===0?'r1':i===1?'r2':i===2?'r3':'';
  const medal=['🥇','🥈','🥉'];
  el.innerHTML=ranking.map((r,i)=>{
    const pct=Math.round(r.total/total*100);
    return `<div class="rcard ${tc(i)}">
      <div class="pos">${i+1}</div>
      <div class="av">${r.nome.slice(0,2).toUpperCase()}</div>
      <div class="info">
        <div class="name">${r.nome} ${i<3?medal[i]:''}</div>
        <div class="detail">${r.exatos} exatos · ${r.vencedores} vencedor · ${r.total}/${total}</div>
        <div class="mprog"><div class="mfill" style="width:${pct}%"></div></div>
      </div>
      <div class="pts-block">
        <div class="pts-num">${r.pts}</div>
        <div class="pts-lbl">pts</div>
      </div>
    </div>`;
  }).join('');
}
load();setInterval(load,30000);
</script>
</body>
</html>
