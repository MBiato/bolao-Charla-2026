<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Charla Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1E5C;--navy-deep:#091244;--terra:#C4510A;--gold:#D4A000;--cream:#F0EAE0;--cream2:#F5F0EA;--blue-mid:#9FA8C9}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh}
.header{background:var(--cream2);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--terra)}
.charla-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--navy);letter-spacing:.04em;line-height:1}
.charla-logo span{color:var(--terra)}
.sb-logo{height:20px;object-fit:contain}
.nav-links{display:flex;align-items:center;gap:.75rem}
.nav-links a{color:var(--terra);font-size:.78rem;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.wrap{padding:1rem 1.1rem;max-width:480px;margin:0 auto}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--cream);letter-spacing:.04em;line-height:1;margin-bottom:.2rem}
.page-sub{font-size:.68rem;color:rgba(240,234,224,.35);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--terra);display:inline-block;animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.twoup-promo{background:rgba(212,160,0,.08);border:1px solid rgba(212,160,0,.18);border-radius:6px;padding:.65rem .85rem;margin-bottom:.85rem;display:flex;align-items:center;gap:.6rem}
.twoup-promo-text{font-size:.72rem;color:rgba(212,160,0,.8);line-height:1.4}
.twoup-promo-text strong{color:var(--gold)}
.rcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:.85rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.7rem;border-left:3px solid transparent}
.rcard.r1{border-left-color:var(--gold);background:rgba(212,160,0,.07)}
.rcard.r2{border-left-color:#B0B0B0;background:rgba(192,192,192,.05)}
.rcard.r3{border-left-color:var(--terra);background:rgba(196,81,10,.06)}
.pos{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:rgba(255,255,255,.12);width:24px;text-align:center;flex-shrink:0;line-height:1}
.rcard.r1 .pos{color:var(--gold)}
.rcard.r2 .pos{color:#B0B0B0}
.rcard.r3 .pos{color:var(--terra)}
.av{width:36px;height:36px;border-radius:3px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:rgba(240,234,224,.5);flex-shrink:0}
.rcard.r1 .av{background:var(--gold);color:#412402}
.rcard.r2 .av{background:#B0B0B0;color:#2C2C2A}
.rcard.r3 .av{background:var(--terra);color:var(--cream2)}
.info{flex:1;min-width:0}
.name{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cream);display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.detail{font-size:.67rem;color:rgba(240,234,224,.35);margin-top:2px}
.mprog{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:.35rem;overflow:hidden}
.mfill{height:3px;background:var(--terra);border-radius:2px}
.pts-block{text-align:right;flex-shrink:0}
.pts-num{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--terra);line-height:1}
.pts-lbl{font-size:.62rem;color:rgba(240,234,224,.3);text-transform:uppercase;letter-spacing:.06em}
.twoup-badge{display:inline-flex;align-items:center;background:var(--gold);color:#412402;font-size:.58rem;font-weight:700;padding:1px 5px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.btn{width:100%;padding:.85rem;border-radius:4px;border:none;cursor:pointer;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:.45rem;font-family:'Inter',sans-serif}
.btn-cream{background:var(--cream2);color:var(--navy)}
.btn-glass{background:rgba(255,255,255,.07);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.empty{text-align:center;padding:3rem 1rem;color:rgba(240,234,224,.3)}
.sponsor-bar{background:var(--navy-deep);padding:.55rem 1.1rem;display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.sponsor-bar span{font-size:.62rem;color:rgba(240,234,224,.3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div><div class="charla-logo">CHARLA <span>COPA</span></div></div>
  <div class="nav-links">
    <a href="resultados.html">Resultados</a>
    <a href="/">Palpitar</a>
    <img src="sportingbet-blue.png" class="sb-logo" alt="Sportingbet">
  </div>
</div>
<div class="wrap">
  <div class="page-title">Ranking</div>
  <div class="page-sub"><div class="live-dot"></div>Ao vivo · atualiza a cada 30s</div>
  <div class="twoup-promo">
    <div style="font-size:1.1rem">⚡</div>
    <div class="twoup-promo-text"><strong>Condição 2UP Sportingbet:</strong> se um time abrir 2 a 0, quem apostou nele já garante o ponto!</div>
  </div>
  <div id="content"><div class="empty">Carregando...</div></div>
  <button class="btn btn-cream" onclick="load()">Atualizar agora</button>
  <button class="btn btn-glass" onclick="location.href='/'">Dar palpites</button>
</div>
<div class="sponsor-bar">
  <span>Patrocinador oficial</span>
  <img src="sportingbet-white.png" style="height:16px;object-fit:contain" alt="Sportingbet">
</div>
<script>
async function load(){
  const [ranking,jogos]=await Promise.all([fetch('/api/ranking').then(r=>r.json()),fetch('/api/jogos').then(r=>r.json())]);
  const total=jogos.length;
  const el=document.getElementById('content');
  if(!ranking.length){el.innerHTML='<div class="empty">Nenhum palpite ainda.</div>';return;}
  const tc=i=>i===0?'r1':i===1?'r2':i===2?'r3':'';
  const medal=['🥇','🥈','🥉'];
  el.innerHTML=ranking.map((r,i)=>{
    const pct=Math.round(r.total/total*100);
    const twoupTag=r.twoup>0?`<span class="twoup-badge">⚡ ${r.twoup} 2UP</span>`:'';
    return `<div class="rcard ${tc(i)}">
      <div class="pos">${i+1}</div>
      <div class="av">${r.nome.slice(0,2).toUpperCase()}</div>
      <div class="info">
        <div class="name">${r.nome} ${i<3?medal[i]:''} ${twoupTag}</div>
        <div class="detail">${r.exatos} exatos · ${r.vencedores} vencedor · ${r.total}/${total}</div>
        <div class="mprog"><div class="mfill" style="width:${pct}%"></div></div>
      </div>
      <div class="pts-block"><div class="pts-num">${r.pts}</div><div class="pts-lbl">pts</div></div>
    </div>`;
  }).join('');
}
load();setInterval(load,30000);
</script>
</body>
</html>
